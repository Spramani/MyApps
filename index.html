<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My App Portfolio</title>
    <meta name="description" content="Discover my latest applications including Drifty and AquaSort.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-animation">
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <header class="header">
        <nav class="nav">
            <h1 class="logo">App<span>Studio</span></h1>
        </nav>
    </header>

    <main class="main-content">
        <section class="hero">
            <h2 class="hero-title">Experience <br>Next-Gen Apps</h2>
            <p class="hero-subtitle">Explore a collection of beautifully crafted and engaging applications.</p>
        </section>

        <section class="apps-grid" id="apps">
            <!-- App Card 1 -->
            <a href="https://spramani.github.io/Drifty_url/" target="_blank" class="app-card" rel="noopener noreferrer">
                <div class="card-inner">
                    <div class="app-icon-container">
                        <img src="./assets/drifty_app_icon.png" alt="Drifty App Icon" class="app-icon">
                    </div>
                    <div class="app-details">
                        <h3 class="app-name">Drifty</h3>
                        <p class="app-desc">High-octane racing and drifting experience.</p>
                        <span class="btn-play">Play Now</span>
                    </div>
                </div>
            </a>

            <!-- App Card 2 -->
            <a href="https://spramani.github.io/AquaSort_Urls/" target="_blank" class="app-card" rel="noopener noreferrer">
                <div class="card-inner">
                    <div class="app-icon-container">
                        <img src="./assets/aquasort_app_icon.png" alt="AquaSort App Icon" class="app-icon">
                    </div>
                    <div class="app-details">
                        <h3 class="app-name">AquaSort</h3>
                        <p class="app-desc">Relaxing and colorful liquid sorting puzzle.</p>
                        <span class="btn-play">Play Now</span>
                    </div>
                </div>
            </a>
            
            <!-- Future apps can be added here easily -->
        </section>
    </main>

    <footer class="footer">
        <p>&copy; 2026 AppStudio. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
